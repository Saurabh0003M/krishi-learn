<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Krishi Learn - Login & Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #4CAF50;
      --accent-color: #A5D6A7;
      --bg-color: #f0fdf4;
      --text-color: #2E7D32;
      --white: #fff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: var(--white);
      width: 380px;
      padding: 2rem;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      position: relative;
      overflow: hidden;
    }

    .tabs {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .tabs button {
      flex: 1;
      padding: 0.75rem 1rem;
      background: none;
      border: none;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--text-color);
      cursor: pointer;
      transition: 0.3s;
      border-bottom: 3px solid transparent;
    }

    .tabs button.active {
      border-color: var(--primary-color);
    }

    form {
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      margin-bottom: 0.3rem;
      color: #555;
    }

    .form-group input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    .submit-btn {
      width: 100%;
      padding: 0.7rem;
      background: var(--primary-color);
      color: white;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #388E3C;
    }

    .footer-text {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #777;
    }

    .logo {
      text-align: center;
      margin-bottom: 1rem;
    }

    .logo h2 {
      color: var(--primary-color);
      font-size: 1.8rem;
      font-weight: 700;
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }

    @media (max-width: 420px) {
      .container {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">
      <h2>🌾 Krishi Learn</h2>
    </div>
    <div class="tabs">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="active">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required />
      </div>
      <button class="submit-btn" type="submit">Login</button>
      <p class="footer-text">New to Krishi Learn? Click Register above.</p>
    </form>

    <!-- Register Form -->
    <form id="registerForm">
      <div class="form-group">
        <label for="registerName">Full Name</label>
        <input type="text" id="registerName" placeholder="Your full name" required />
      </div>
      <div class="form-group">
        <label for="registerEmail">Email</label>
        <input type="email" id="registerEmail" placeholder="Enter your email" required />
      </div>
      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword" placeholder="Create a password" required />
      </div>
      <button class="submit-btn" type="submit">Register</button>
      <p class="footer-text">Already have an account? Click Login above.</p>
    </form>
  </div>

  <script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');

    loginTab.addEventListener('click', () => {
      loginTab.classList.add('active');
      registerTab.classList.remove('active');
      loginForm.classList.add('active');
      registerForm.classList.remove('active');
    });

    registerTab.addEventListener('click', () => {
      registerTab.classList.add('active');
      loginTab.classList.remove('active');
      registerForm.classList.add('active');
      loginForm.classList.remove('active');
    });

    // You can add form submission logic here
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();   
      window.location.href = "/dashboard.html"
      
    //   alert('Logging in... (hook your backend here)');
    });

    registerForm.addEventListener('submit', function(e) {
      e.preventDefault();
    //   console.log(e);
      
      window.location.href = "/dashboard.html"
    });
  </script>
</body>
</html>
